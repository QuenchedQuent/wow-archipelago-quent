# Builds the two things players download:
#   wow.apworld                         - Archipelago world + client (PyMySQL vendored)
#   WoW-Archipelago-Server-win64.zip    - prebuilt AzerothCore + mod-ale + portable MySQL + scripts
#
# Run manually (Actions tab -> Run workflow) or push a tag like v0.1.0 to publish a release.
# GitHub's Windows runners include Visual Studio, so nobody needs it locally.

name: Build Windows package

on:
  workflow_dispatch:
    inputs:
      azerothcore_ref:
        description: azerothcore-wotlk branch/tag/commit (blank = pinned known-good commit)
        default: ''
      ale_ref:
        description: mod-ale branch/tag/commit (blank = pinned known-good commit)
        default: ''
  push:
    tags: ['v*']

# Known-good versions. Releases (tag pushes) always build these, so every release is
# reproducible. To upgrade: run the workflow with "master" in the inputs, test the
# package, then update these to the commits printed in versions.txt.
env:
  AC_REF: ${{ inputs.azerothcore_ref || '437ac413284309bccdcff765b0427c862b3a38c6' }}
  ALE_REF: ${{ inputs.ale_ref || '84b85cc55980dbf67d596f3d5cb34ded10c59102' }}
  BOOST_VERSION: 1.87.0          # matches AzerothCore's own Windows CI
  MYSQL_VERSION: 8.4.9           # MySQL 8.4 LTS; must be 8.x (AzerothCore doesn't support newer majors)
  PYMYSQL_VERSION: 1.1.1

jobs:
  apworld:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Vendor PyMySQL and build wow.apworld
        run: |
          pip install --no-deps --target apworld/wow/vendor "pymysql==${PYMYSQL_VERSION}"
          rm -rf apworld/wow/vendor/bin
          cd apworld
          zip -r ../wow.apworld wow -x '*/__pycache__/*'
      - uses: actions/upload-artifact@v4
        with:
          name: wow-apworld
          path: wow.apworld

  server:
    runs-on: windows-latest
    timeout-minutes: 300
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          path: project

      - name: Clone AzerothCore and mod-ale
        run: |
          git clone -c core.autocrlf=false https://github.com/azerothcore/azerothcore-wotlk.git ac
          git -C ac checkout $env:AC_REF
          git clone -c core.autocrlf=false https://github.com/azerothcore/mod-ale.git ac/modules/mod-ale
          git -C ac/modules/mod-ale checkout $env:ALE_REF
          "AC commit:  $(git -C ac rev-parse HEAD)"  | Tee-Object -Append versions.txt
          "ALE commit: $(git -C ac/modules/mod-ale rev-parse HEAD)" | Tee-Object -Append versions.txt

      - name: Cache Boost and MySQL
        uses: actions/cache@v6
        with:
          path: |
            C:\local\boost
            C:\tools\mysql\current
          key: deps-boost${{ env.BOOST_VERSION }}-mysql${{ env.MYSQL_VERSION }}

      # Mirrors AzerothCore's own windows_build.yml, which knows the quirks of these hosts.
      - name: Install Boost and MySQL
        run: |
          $ErrorActionPreference = 'Stop'

          # Boost: SourceForge serves an HTML page to user agents starting with "Mozilla",
          # so use a non-browser UA and the downloads.sourceforge.net (https mirror) host.
          $boostDir = 'C:\local\boost'
          if (-not (Test-Path "$boostDir\boost\version.hpp")) {
            $u = $env:BOOST_VERSION -replace '\.', '_'
            $boostExe = Join-Path $env:RUNNER_TEMP 'boost.exe'
            $req = @{
              Uri = "https://downloads.sourceforge.net/project/boost/boost-binaries/$env:BOOST_VERSION/boost_$u-msvc-14.3-64.exe"
              OutFile = $boostExe; UserAgent = 'wow-archipelago-ci'
              ConnectionTimeoutSeconds = 60; OperationTimeoutSeconds = 60
            }
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              try {
                Invoke-WebRequest @req
                $mb = (Get-Item $boostExe).Length / 1MB
                if ($mb -lt 50) { throw "got $([int]$mb) MB, likely an HTML page" }
                break
              } catch {
                Write-Host "Boost download attempt $attempt failed: $($_.Exception.Message)"
                if ($attempt -eq 3) { throw }
                Start-Sleep -Seconds 15
              }
            }
            $p = Start-Process $boostExe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$boostDir" -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Boost installer exit code $($p.ExitCode)" }
            if (-not (Test-Path "$boostDir\lib64-msvc-14.3")) { throw 'Boost libs missing after install' }
          }

          # MySQL: Oracle's archive CDN wants a browser user agent (the opposite of SourceForge).
          $mysqlDir = 'C:\tools\mysql\current'
          if (-not (Test-Path "$mysqlDir\lib\libmysql.lib")) {
            $v = $env:MYSQL_VERSION; $mm = ($v -split '\.')[0..1] -join '.'
            $zip = Join-Path $env:RUNNER_TEMP 'mysql.zip'
            Invoke-WebRequest -Uri "https://cdn.mysql.com/archives/mysql-$mm/mysql-$v-winx64.zip" -OutFile $zip -UserAgent 'Mozilla/5.0'
            if ((Get-Item $zip).Length -lt 50MB) { throw 'MySQL download looks wrong' }
            New-Item -ItemType Directory -Force 'C:\tools\mysql' | Out-Null
            7z x $zip -oC:\tools\mysql | Out-Null
            if (Test-Path $mysqlDir) { Remove-Item -Recurse -Force $mysqlDir }
            Rename-Item "C:\tools\mysql\mysql-$v-winx64" 'current'
            if (-not (Test-Path "$mysqlDir\lib\libmysql.lib")) { throw 'libmysql.lib missing in MySQL zip' }
          }

          # OpenSSL: preinstalled on the runner image.
          $openssl = @($env:OPENSSL_ROOT_DIR, 'C:\Program Files\OpenSSL', 'C:\Program Files\OpenSSL-Win64') |
            Where-Object { $_ -and (Test-Path (Join-Path $_ 'include\openssl\opensslv.h')) } | Select-Object -First 1
          if (-not $openssl) { throw 'OpenSSL not found on runner' }

          "BOOST_ROOT=$boostDir"     | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "MYSQL_DIR=$mysqlDir"      | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "OPENSSL_ROOT_DIR=$openssl" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          Write-Host "Boost: $boostDir  MySQL: $mysqlDir  OpenSSL: $openssl"

      - name: Configure
        run: |
          cmake -S ac -B build -A x64 `
            -DTOOLS_BUILD=none -DSCRIPTS=static -DMODULES=static `
            -DBOOST_ROOT="$env:BOOST_ROOT" `
            -DOPENSSL_ROOT_DIR="$env:OPENSSL_ROOT_DIR" `
            -DMYSQL_INCLUDE_DIR="$env:MYSQL_DIR/include" `
            -DMYSQL_LIBRARY="$env:MYSQL_DIR/lib/libmysql.lib"

      - name: Build
        run: cmake --build build --config RelWithDebInfo --parallel

      - name: Assemble package
        run: |
          $ErrorActionPreference = 'Stop'
          $pkg = 'dist\WoW-Archipelago-Server'
          New-Item -ItemType Directory -Force "$pkg\server\configs\modules", "$pkg\mysql", "$pkg\source\data" | Out-Null

          # Server binaries (no .pdb - they're huge) and config templates.
          $bin = (Get-ChildItem build -Recurse -Filter worldserver.exe | Select-Object -First 1).DirectoryName
          Get-ChildItem $bin -File | Where-Object { $_.Extension -in '.exe', '.dll' } | Copy-Item -Destination "$pkg\server"
          Get-ChildItem build -Recurse -Filter '*.conf.dist' | ForEach-Object {
            $dest = if ($_.Name -in 'worldserver.conf.dist', 'authserver.conf.dist') { "$pkg\server\configs" } else { "$pkg\server\configs\modules" }
            Copy-Item $_.FullName $dest -Force
          }
          if (-not (Test-Path "$pkg\server\configs\modules\mod_ale.conf.dist")) { throw 'mod_ale.conf.dist missing - ALE not built?' }

          # Runtime DLLs: OpenSSL, MySQL client, MSVC runtime (app-local).
          Get-ChildItem "$env:OPENSSL_ROOT_DIR\bin" -Filter 'lib*-3-x64.dll' | Copy-Item -Destination "$pkg\server" -Force
          Copy-Item "$env:MYSQL_DIR\lib\libmysql.dll" "$pkg\server" -Force
          # Must be the NEWEST redist: binaries built with a newer toolset crash (0xC0000005 in
          # msvcp140.dll) when run against an older runtime. VS ships several CRT folders.
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $msvcp = Get-ChildItem "$vs\VC\Redist\MSVC" -Recurse -Filter 'msvcp140.dll' |
                   Where-Object { $_.FullName -match '\\x64\\Microsoft\.VC14\d\.CRT\\' -and $_.FullName -notmatch 'onecore|debug|spectre' } |
                   Sort-Object { $_.VersionInfo.FileVersionRaw } -Descending | Select-Object -First 1
          if (-not $msvcp) { throw 'MSVC x64 CRT redist not found' }
          $crt = $msvcp.Directory
          "Bundling MSVC runtime $($msvcp.VersionInfo.FileVersion) from $($crt.FullName)"
          Copy-Item "$($crt.FullName)\*.dll" "$pkg\server" -Force

          # Portable MySQL server (trimmed).
          New-Item -ItemType Directory -Force "$pkg\mysql\bin", "$pkg\mysql\lib" | Out-Null
          Copy-Item "$env:MYSQL_DIR\bin\mysqld.exe", "$env:MYSQL_DIR\bin\mysql.exe", "$env:MYSQL_DIR\bin\mysqladmin.exe" "$pkg\mysql\bin"
          Copy-Item "$env:MYSQL_DIR\bin\*.dll" "$pkg\mysql\bin"
          Copy-Item "$($crt.FullName)\*.dll" "$pkg\mysql\bin" -Force
          Copy-Item -Recurse "$env:MYSQL_DIR\share" "$pkg\mysql\share"
          Copy-Item -Recurse "$env:MYSQL_DIR\lib\plugin" "$pkg\mysql\lib\plugin"
          Copy-Item "$env:MYSQL_DIR\LICENSE" "$pkg\mysql\" -ErrorAction SilentlyContinue

          # SQL for AzerothCore's auto-setup, plus our tables as custom characters SQL.
          Copy-Item -Recurse ac\data\sql "$pkg\source\data\sql"
          New-Item -ItemType Directory -Force "$pkg\source\data\sql\custom\db_characters" | Out-Null
          Copy-Item project\server\sql\archipelago_schema.sql "$pkg\source\data\sql\custom\db_characters\"

          # Our pieces.
          Copy-Item -Recurse project\server\lua_scripts "$pkg\lua_scripts"
          New-Item -ItemType Directory -Force "$pkg\addon" | Out-Null
          Copy-Item -Recurse project\addon\Archipelago "$pkg\addon\Archipelago"
          Copy-Item -Recurse project\package\scripts "$pkg\scripts"
          Copy-Item project\package\*.bat, project\package\README.txt $pkg
          Copy-Item versions.txt $pkg

          # Smoke test: every bundled binary must start using the bundled DLLs
          # (app-local DLLs win over System32, so this catches runtime mismatches).
          foreach ($exe in "$pkg\server\worldserver.exe", "$pkg\server\authserver.exe") {
            $p = Start-Process $exe -ArgumentList '--version' -WorkingDirectory (Split-Path $exe) `
                   -NoNewWindow -Wait -PassThru -RedirectStandardOutput "$env:RUNNER_TEMP\v.txt"
            Get-Content "$env:RUNNER_TEMP\v.txt"
            if ($p.ExitCode -ne 0) { throw "$exe --version failed with exit code $($p.ExitCode)" }
          }
          & "$pkg\mysql\bin\mysqld.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'mysqld --version failed' }

          7z a -tzip -mx=7 dist\WoW-Archipelago-Server-win64.zip ".\$pkg\*" | Out-Null
          "Package size: $([math]::Round((Get-Item dist\WoW-Archipelago-Server-win64.zip).Length / 1MB)) MB"

      - uses: actions/upload-artifact@v4
        with:
          name: wow-archipelago-server-win64
          path: dist/WoW-Archipelago-Server-win64.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [apworld, server]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            out/wow.apworld
            out/WoW-Archipelago-Server-win64.zip
